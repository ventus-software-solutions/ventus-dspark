name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "scripts/build.sh"
      - "compose/**"
      - "ventus-dspark"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: ./scripts/build.sh
        env:
          VENTUS_TAG: ghcr.io/${{ github.repository_owner }}/dspark-vllm:0731-0.1.0

      - name: Tag by commit sha
        run: docker tag ghcr.io/${{ github.repository_owner }}/dspark-vllm:0731-0.1.0 ghcr.io/${{ github.repository_owner }}/dspark-vllm:${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/dspark-vllm:0731-0.1.0
          docker push ghcr.io/${{ github.repository_owner }}/dspark-vllm:${{ github.sha }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/dspark-vllm:0731-0.1.0
          artifact-name: sbom-${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/dspark-vllm:0731-0.1.0
